<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLO Pot Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap');

  :root{
    --page:#f4f5f6;
    --surface:#ffffff;
    --ink:#16191c;
    --muted:#5b6369;
    --rule:#d3d8dc;
    --rule-strong:#8d959b;
    --felt:#1f5a43;
    --felt-edge:#16402f;
    --good:#17693f;
    --bad:#b3261e;
    --chip-white:#f1ede2;
    --chip-red:#d64545;
    --chip-blue:#3f7fc4;
    --chip-green:#3f9a69;
    --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.45;
    font-variant-numeric:tabular-nums;
    min-height:100vh;
    padding:20px 16px 56px;
    overflow-x:hidden;
  }
  button,input{font-family:var(--font);}

  .wrap{max-width:560px;margin:0 auto;}

  /* Header */
  .nameplate{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--rule);
  }
  .brand h1{
    font-size:22px;
    font-weight:700;
    line-height:1.2;
    margin:0;
  }
  .brand p{
    margin:3px 0 0;
    font-size:14px;
    color:var(--muted);
  }
  .scoreboard{text-align:right;flex-shrink:0;}
  .scoreboard .streak{font-size:16px;font-weight:600;}
  .scoreboard .tally{font-size:14px;color:var(--muted);}

  /* Controls */
  .street-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border:1px solid var(--ink);
    border-radius:4px;
    overflow:hidden;
    margin:16px 0 12px;
  }
  .street-btn{
    font-size:15px;
    font-weight:600;
    min-height:44px;
    padding:8px 6px;
    border:none;
    border-left:1px solid var(--ink);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
  }
  .street-btn:first-child{border-left:none;}
  .street-btn.selected{background:var(--ink);color:#fff;}
  .street-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;}
  .street-btn.selected:focus-visible{outline-color:#fff;}

  .stakes-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:0 0 14px;
  }
  .chip-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    min-height:54px;
    padding:8px 10px;
    border:1px solid var(--rule-strong);
    border-radius:4px;
    background:var(--surface);
    color:var(--ink);
    font-size:15px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
  }
  .chip-btn .stk{display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .chip-btn .dot{
    width:12px;height:12px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.35);
    flex-shrink:0;
  }
  .chip-btn .bi{font-size:12px;font-weight:400;color:var(--muted);}
  .chip-btn.selected{
    border-color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--ink);
  }
  .chip-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  .settings-row{
    display:flex;
    gap:22px;
    margin:0 0 16px;
    flex-wrap:wrap;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:32px;
    font-size:15px;
    cursor:pointer;
    user-select:none;
  }
  .toggle input{
    width:18px;height:18px;
    margin:0;
    accent-color:var(--ink);
    cursor:pointer;
  }
  .toggle .switch{display:none;}
  .toggle:has(input:disabled){color:var(--muted);opacity:.6;cursor:not-allowed;}
  .toggle input:disabled{cursor:not-allowed;}

  /* Table */
  .table-panel{margin-bottom:16px;}
  @media (min-width:700px){ .table-panel{margin-left:-70px;margin-right:-70px;} }
  .table-frame{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
  }
  .rail{
    position:absolute;
    inset:8% 6%;
    border-radius:50%;
    background:var(--felt);
    border:5px solid var(--felt-edge);
  }

  .seat{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:60px;
    transition:opacity .2s ease;
  }
  .seat.folded{opacity:0.35;}
  .seat .avatar-ring{
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    color:var(--ink);
    border:2px solid var(--ink);
    font-size:15px;
    font-weight:600;
  }
  .seat.hero .avatar-ring{
    background:var(--ink);
    color:#fff;
    box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink);
  }
  .seat .label{
    margin-top:5px;
    padding:1px 6px;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:11px;
    line-height:1.25;
    text-align:center;
    white-space:nowrap;
  }
  .seat .label:not(:has(.tag:not(:empty))){display:none;}
  .seat .label .tag{display:block;font-weight:700;font-size:15px;line-height:1.25;}
  .seat .label .tag:empty{display:none;}
  .seat .label .tag.status{font-weight:400;font-size:11px;color:var(--muted);}
  .seat .label .tag.pot-status{font-weight:700;font-size:14px;color:var(--bad);}

  .centerpot{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .centerpot .coins{position:relative;width:30px;height:30px;}
  .centerpot .coins .c{
    position:absolute;
    left:0;
    width:30px;
    height:12px;
    border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.35);
    background:var(--chip-white);
  }
  .centerpot .amt{font-size:18px;font-weight:700;color:#fff;white-space:nowrap;}
  .centerpot .caption{font-size:12px;color:rgba(255,255,255,0.85);}

  .chipstack{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .chipstack .coins{position:relative;width:20px;height:22px;}
  .chipstack .coins .c{
    position:absolute;
    left:0;
    width:20px;
    height:9px;
    border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.4);
  }
  .chipstack .amt{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;}
  .chipstack .pot-tag{
    padding:1px 6px;
    background:var(--surface);
    color:var(--bad);
    border-radius:3px;
    font-size:11px;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
  }

  /* Question and answer */
  .answer-panel{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:16px;
  }
  .question{
    font-size:16px;
    line-height:1.5;
    margin-bottom:12px;
  }
  .question b{font-weight:600;}

  .answer-row{display:flex;gap:8px;margin-bottom:12px;}
  .answer-row input{
    flex:1;
    min-width:0;
    min-height:48px;
    padding:8px 12px;
    font-size:20px;
    font-weight:500;
    border:1px solid var(--rule-strong);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .answer-row input:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .answer-row input::placeholder{color:#7a8288;}

  .btn{
    min-height:44px;
    padding:8px 18px;
    border:1px solid var(--ink);
    border-radius:4px;
    background:var(--ink);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{background:#2c3237;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .btn.secondary{background:var(--surface);color:var(--ink);}
  .btn.secondary:hover{background:#eceeef;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #skipBtn{min-height:36px;}

  .feedback{
    font-size:16px;
    font-weight:600;
    min-height:22px;
    margin-bottom:10px;
  }
  .feedback:empty{min-height:0;margin:0;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  /* Count slip */
  .ticket{
    display:none;
    margin-bottom:4px;
    padding:14px 16px;
    background:var(--page);
    border:1px dashed var(--rule-strong);
    border-radius:4px;
  }
  .ticket.show{display:block;}
  .ticket h3{
    margin:0 0 8px;
    padding-bottom:8px;
    border-bottom:1px dashed var(--rule-strong);
    font-size:15px;
    font-weight:600;
  }
  .ticket .line{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:3px 0;
    font-size:15px;
  }
  .ticket .line.total{
    margin-top:8px;
    padding-top:8px;
    border-top:2px solid var(--ink);
    font-size:17px;
    font-weight:700;
  }
  .ticket .formula{margin:6px 0 2px;font-size:14px;color:var(--muted);}

  .bottom-actions{
    margin-top:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  /* Button seat */
  .seat.is-btn .avatar-ring{background:#f7c948;border-color:var(--ink);}
  .seat.is-btn.hero .avatar-ring{background:var(--ink);color:#fff;}
  .seat.is-btn .label{background:#f7c948;border-color:#c9971a;}
  .seat.is-btn .label .tag.status{color:var(--ink);}

  /* Motion and touch feedback */
  .btn, .street-btn, .chip-btn{
    transition:background-color .12s ease, border-color .12s ease, color .12s ease, transform .1s ease, box-shadow .12s ease;
  }
  .btn:active:not(:disabled){transform:translateY(1px);box-shadow:none;}
  .chip-btn:active{transform:translateY(1px);}
  .street-btn:active:not(.selected){background:#e3e6e8;}
  @media (hover:hover){
    .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 2px 0 rgba(22,25,28,0.35);}
    .btn:hover:active:not(:disabled){transform:translateY(1px);box-shadow:none;}
    .street-btn:not(.selected):hover{background:#eceeef;}
    .chip-btn:not(.selected):hover{border-color:var(--ink);transform:translateY(-1px);}
    .seat:hover .avatar-ring{transform:scale(1.08);}
    .chipstack:hover .coins{transform:translateY(-2px);}
  }
  .chipstack .coins{transition:transform .15s ease;}
  .seat .avatar-ring{transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease;}
  .seat.acting .avatar-ring{transform:scale(1.14);box-shadow:0 0 0 3px rgba(255,255,255,0.9);}
  .chipstack{opacity:1;}
  .chipstack.moving{
    transition:left .4s cubic-bezier(.2,.8,.2,1), top .4s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  }
  .chipstack.sweep{
    transition:left .45s ease-in, top .45s ease-in, opacity .45s ease-in;
  }
  .chipstack .amt.bump{animation:bump .28s ease;}
  @keyframes bump{0%{transform:scale(1.35);}100%{transform:scale(1);}}
  .centerpot.pop{animation:potpop .3s ease;}
  @keyframes potpop{
    0%{transform:translate(-50%,-50%) scale(.8);opacity:0;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  .feedback.good, .feedback.bad{animation:fbin .22s ease;}
  .ticket.show{animation:fbin .25s ease;}
  @keyframes fbin{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .sound-btn{
    margin-top:6px;
    min-height:32px;
    padding:4px 10px;
    border:1px solid var(--rule-strong);
    border-radius:4px;
    background:var(--surface);
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .sound-btn[aria-pressed="false"]{color:var(--muted);}
  .sound-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important;}
  }

  /* Phones */
  @media (max-width:520px){
    body{padding:14px 12px 48px;}
    .table-panel{margin:0 -12px 16px;}
    .table-frame{aspect-ratio:1/1;}
    .rail{inset:9% 4%;}
    .stakes-row{grid-template-columns:repeat(2,1fr);}
    .seat{width:50px;}
    .seat .avatar-ring{width:30px;height:30px;font-size:14px;}
    .seat .label{padding:1px 5px;}
    .seat .label .tag{font-size:14px;}
    .seat .label .tag.status{font-size:10px;}
    .seat .label .tag.pot-status{font-size:13px;}
    .centerpot .coins{width:22px;height:22px;}
    .centerpot .coins .c{width:22px;height:9px;}
    .centerpot .amt{font-size:15px;}
    .centerpot .caption{font-size:11px;}
    .chipstack .coins{width:14px;height:16px;}
    .chipstack .coins .c{width:14px;height:6px;}
    .chipstack .amt{font-size:13px;}
    .chipstack .pot-tag{font-size:10px;padding:1px 4px;}
    .answer-panel{padding:14px;}
    .bottom-actions{flex-direction:column;}
    .bottom-actions .btn{width:100%;}
  }
  @media (max-width:360px){
    .street-btn{font-size:14px;}
    .scoreboard .streak{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="nameplate">
    <div class="brand">
      <h1>PLO Pot Trainer</h1>
      <p>Practice announcing the count.</p>
    </div>
    <div class="scoreboard">
      <div class="streak" id="streakVal">Streak 0</div>
      <div class="tally" id="tallyVal">0 / 0 correct</div>
      <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </div>

  <div class="street-row" id="streetRow">
    <button class="street-btn selected" data-street="preflop">Preflop</button>
    <button class="street-btn" data-street="flop">Flop</button>
    <button class="street-btn" data-street="whole">Whole Hand</button>
  </div>

  <div class="stakes-row" id="stakesRow"></div>

  <div class="settings-row">
    <label class="toggle">
      <input type="checkbox" id="straddleToggle">
      <span class="switch"></span>
      Straddle
    </label>
    <label class="toggle" id="dblStraddleLabel">
      <input type="checkbox" id="doubleStraddleToggle" disabled>
      <span class="switch"></span>
      Double Straddle
    </label>
  </div>

  <div class="table-panel">
    <div class="table-frame">
      <div class="rail"></div>
      <div id="seatLayer"></div>
      <div id="chipLayer"></div>
      <div id="centerPot" class="centerpot" style="display:none;"></div>
    </div>
  </div>

  <div class="answer-panel">
    <div class="question" id="questionText"></div>
    <div class="answer-row">
      <input type="number" inputmode="numeric" id="answerInput" placeholder="Total amount ($)">
      <button class="btn" id="submitBtn">Lock it in</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="ticket" id="ticket">
      <h3>Dealer's Count Slip</h3>
      <div class="line"><span>Last bet</span><b id="tLastBet"></b></div>
      <div class="line"><span>Trails (everything else already in)</span><b id="tTrails"></b></div>
      <div class="formula" id="tFormula1"></div>
      <div class="line" id="tAlreadyInRow"><span id="tAlreadyInLabel"></span><b id="tAlreadyIn"></b></div>
      <div class="formula" id="tFormula2"></div>
      <div class="line total"><span>The count</span><span id="tTotal"></span></div>
      <div class="line"><span>New chips added this action</span><span id="tNewLevel"></span></div>
    </div>
    <div class="bottom-actions">
      <button class="btn" id="proceedBtn" style="display:none;">Proceed to next action</button>
      <button class="btn secondary" id="nextBtn">Deal Next Hand</button>
    </div>
  </div>
</div>

<script>
const STAKES = [
  {key:'2-2',   sb:2,  bb:2,  label:'2 / 2',   bg:'var(--chip-white)', fg:'var(--chip-white-text)', buyIn:'$100 – $500',       minStack:100,  stackScale:1,  maxStack:2000},
  {key:'5-5',   sb:5,  bb:5,  label:'5 / 5',   bg:'var(--chip-red)',   fg:'#fff',                    buyIn:'$300 – $1,500',     minStack:300,  stackScale:3,  maxStack:6000},
  {key:'10-10', sb:10, bb:10, label:'10 / 10', bg:'var(--chip-blue)',  fg:'#fff',                    buyIn:'$1,000 – $5,000',   minStack:1000, stackScale:10, maxStack:20000},
  {key:'25-25', sb:25, bb:25, label:'25 / 25', bg:'var(--chip-green)', fg:'#08281a',                 buyIn:'$2,500 – no max*',  minStack:2500, stackScale:20, maxStack:40000},
];

let currentStake = STAKES[0];
let currentStreet = 'preflop';
let scenario = null;
let correct = 0, attempts = 0, streak = 0;
let answered = false;

const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let actingDiv = null;
function setActing(div){
  if(actingDiv) actingDiv.classList.remove('acting');
  actingDiv = div || null;
  if(actingDiv) actingDiv.classList.add('acting');
}

const Sound = (()=>{
  let ctx = null, on = true, last = 0;
  try{ if(localStorage.getItem('plo-sound') === 'off') on = false; }catch(e){}
  function audio(){
    if(!on) return null;
    try{
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function tone(c, freq, at, dur, type, vol){
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(c, at, dur, freq, vol){
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = c.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(c.currentTime + at);
  }
  return {
    isOn(){ return on; },
    toggle(){
      on = !on;
      try{ localStorage.setItem('plo-sound', on ? 'on' : 'off'); }catch(e){}
      return on;
    },
    unlock(){ audio(); },
    chip(){
      const c = audio(); if(!c) return;
      const now = performance.now();
      if(now - last < 70) return;
      last = now;
      noise(c, 0, 0.05, 3200, 0.35);
      noise(c, 0.055, 0.05, 2600, 0.25);
      tone(c, 1900, 0, 0.03, 'sine', 0.03);
    },
    good(){
      const c = audio(); if(!c) return;
      tone(c, 660, 0, 0.14, 'sine', 0.09);
      tone(c, 880, 0.12, 0.2, 'sine', 0.09);
    },
    bad(){
      const c = audio(); if(!c) return;
      tone(c, 200, 0, 0.28, 'triangle', 0.12);
      tone(c, 150, 0.1, 0.3, 'triangle', 0.1);
    },
    knock(){
      const c = audio(); if(!c) return;
      noise(c, 0, 0.06, 500, 0.4);
      tone(c, 120, 0, 0.08, 'sine', 0.1);
    },
    sweep(){
      const c = audio(); if(!c) return;
      noise(c, 0, 0.32, 900, 0.2);
    }
  };
})();
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, ()=>Sound.unlock(), {once:true}));

const soundBtn = document.getElementById('soundBtn');
function syncSoundBtn(){
  const on = Sound.isOn();
  soundBtn.textContent = on ? 'Sound on' : 'Sound off';
  soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
soundBtn.addEventListener('click', ()=>{ Sound.toggle(); syncSoundBtn(); Sound.chip(); });
syncSoundBtn();

function slideChipIn(div, seatIdx){
  const layer = document.getElementById('chipLayer');
  const to = seatPos(seatIdx, 24, 21);
  if(REDUCED){
    div.style.left = to.x+'%';
    div.style.top = to.y+'%';
    layer.appendChild(div);
    return;
  }
  const from = seatPos(seatIdx, 43, 38);
  div.style.left = from.x+'%';
  div.style.top = from.y+'%';
  div.style.opacity = '0';
  layer.appendChild(div);
  void div.offsetWidth;
  div.classList.add('moving');
  div.style.left = to.x+'%';
  div.style.top = to.y+'%';
  div.style.opacity = '1';
}

const stakesRow = document.getElementById('stakesRow');
STAKES.forEach(s=>{
  const b = document.createElement('button');

function mod8(n){ return ((n%8)+8)%8; }
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rnd(arr.length)]; }
function roundNice(n){ return Math.max(1, Math.round(n)); }
function roundToStake(n, stake){
  if(stake.key === '2-2') return Math.max(1, Math.round(n));
  const step = 5;
  return Math.max(step, Math.round(n/step)*step);
}

const PERSON_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

// Effective stack for the hand: the shortest stack among the players in it.
// Bands are for 2/2 and scale with the stake. Over $2,000 at 2/2 is very rare.
const STACK_BANDS = [
  [0.08, 100, 200],
  [0.27, 200, 400],
  [0.30, 400, 700],
  [0.20, 700, 1200],
  [0.10, 1200, 1600],
  [0.05, 1600, 2000]
];
function drawEffStack(stake){
  const r = Math.random();
  let acc = 0, band = STACK_BANDS[STACK_BANDS.length-1];
  for(const b of STACK_BANDS){ acc += b[0]; if(r < acc){ band = b; break; } }
  const raw = (band[1] + Math.random()*(band[2]-band[1])) * stake.stackScale;
  return roundToStake(Math.min(stake.maxStack, Math.max(stake.minStack, raw)), stake);
}

// What a player does. volRaises = bets and raises made so far this street (straddles do not count).
function chooseAction(phase, toCall, volRaises, canRaise){
  const r = Math.random();
  if(toCall === 0){
    const p = {pre:0.22, flop:0.35, turn:0.28, river:0.22}[phase];
    return (canRaise && r < p) ? 'raise' : 'check';
  }
  let fold, raise;
  if(phase === 'pre'){
    if(volRaises === 0){ fold = 0.36; raise = 0.30; }
    else if(volRaises === 1){ fold = 0.40; raise = 0.22; }
    else { fold = 0.52; raise = 0.18; }
  } else {
    if(volRaises <= 1){ fold = 0.36; raise = 0.24; }
    else { fold = 0.46; raise = 0.18; }
  }
  if(r < fold) return 'fold';
  if(!canRaise || r < 1 - raise) return 'call';
  return 'raise';
}

// Bet sizing as a share of the pot-sized raise. Pot is the most common size.
function pickFactor(phase, volRaises){
  const r = Math.random();
  if(volRaises > 0) return r < 0.85 ? 1 : 0.75;
  if(phase === 'pre') return r < 0.70 ? 1 : (r < 0.85 ? 0.75 : 0.5);
  return r < 0.60 ? 1 : (r < 0.80 ? 0.66 : (r < 0.92 ? 0.5 : 0.33));
}

function simulatePreflopRound(stake, opts){
  const effStack = (opts && opts.effStack) || drawEffStack(stake);
  const buttonIdx = rnd(8);
  const sbIdx = mod8(buttonIdx+1);
  const bbIdx = mod8(buttonIdx+2);
  const straddleIdx = mod8(bbIdx+1);
  const dblStraddleIdx = mod8(bbIdx+2);

  const contributions = new Array(8).fill(0);
  contributions[sbIdx] = stake.sb;
  contributions[bbIdx] = stake.bb;
  let pot = stake.sb + stake.bb;
  let currentBet = stake.bb;
  const folded = new Set();
  const log = [];

  log.push({seat:sbIdx, role:'SB', text:`posts small blind <b>$${stake.sb}</b>`, blind:true, kind:'blind', amount:stake.sb});
  log.push({seat:bbIdx, role:'BB', text:`posts big blind <b>$${stake.bb}</b>`, blind:true, kind:'blind', amount:stake.bb});

  const willStraddle = !!(opts && opts.straddle) && Math.random() < 0.65;
  const willDblStraddle = willStraddle && !!(opts && opts.doubleStraddle) && Math.random() < 0.4;

  if(willStraddle){
    const strAmt = 2*stake.bb;
    contributions[straddleIdx] = strAmt;
    pot += strAmt;
    currentBet = strAmt;
    log.push({seat:straddleIdx, role:'STR', text:`straddles <b>$${strAmt}</b>`, blind:true, kind:'blind', amount:strAmt});
  }
  if(willDblStraddle){
    const dblAmt = 4*stake.bb;
    contributions[dblStraddleIdx] = dblAmt;
    pot += dblAmt;
    currentBet = dblAmt;
    log.push({seat:dblStraddleIdx, role:'STR2', text:`double straddles <b>$${dblAmt}</b>`, blind:true, kind:'blind', amount:dblAmt});
  }

  const roleOf = (idx)=> idx===buttonIdx ? 'BTN' : idx===sbIdx ? 'SB' : idx===bbIdx ? 'BB'
    : (willStraddle && idx===straddleIdx) ? 'STR'
    : (willDblStraddle && idx===dblStraddleIdx) ? 'STR2' : '';

  // Build acting order: everyone else first, then blinds/straddles act last, in the order they were posted
  const lastActors = [sbIdx, bbIdx];
  if(willStraddle) lastActors.push(straddleIdx);
  if(willDblStraddle) lastActors.push(dblStraddleIdx);
  const startSeat = mod8(lastActors[lastActors.length-1] + 1);
  const order = [];
  for(let k=0;k<8-lastActors.length;k++) order.push(mod8(startSeat+k));
  lastActors.forEach(s=>order.push(s));

  let raisesSoFar = willDblStraddle ? 2 : (willStraddle ? 1 : 0);
  let volRaises = 0;
  let anyPotYet = false;
  let liveCount = 8;
  const livePositions = new Set([0,1,2,3,4,5,6,7]);
  let actedSince = new Set();
  let posPointer = 0;
  let guard = 0;

  while(liveCount > 1 && guard < 60){
    guard++;
    const pos = posPointer % 8;
    posPointer++;
    if(!livePositions.has(pos)) continue;
    if(actedSince.has(pos)) break; // action closed, back to someone who already responded

    const seatIdx = order[pos];
    const toCall = currentBet - contributions[seatIdx];
    const remaining = effStack - contributions[seatIdx];   // chips this seat can still put in
    const canRaise = raisesSoFar < 3 && (remaining - toCall) >= stake.bb;
    const wouldClose = (actedSince.size + 1) >= liveCount;
    let action = chooseAction('pre', toCall, volRaises, canRaise);
    let forcedPot = false;

    if(!anyPotYet){
      const handWouldEnd = (action==='fold' && (liveCount-1 <= 1));
      const roundWouldCloseWithNoBet = (action!=='raise' && wouldClose);
      if((handWouldEnd || roundWouldCloseWithNoBet) && (pot + 2*toCall) <= remaining){
        action = 'raise';
        forcedPot = true;
      }
    }

    if(action==='fold'){
      folded.add(seatIdx);
      livePositions.delete(pos); liveCount--;
      actedSince.add(pos);
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:'folds', kind:'fold', amount:null});
    } else if(action==='check'){
      actedSince.add(pos);
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:'checks', kind:'check', amount:null});
    } else if(action==='call'){
      actedSince.add(pos);
      contributions[seatIdx] += toCall;
      pot += toCall;
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:`calls <b>$${toCall}</b>`, kind:'call', amount:contributions[seatIdx]});
    } else {
      const alreadyInBefore = contributions[seatIdx];
      const lastBetBefore = currentBet;
      const potBeforeThis = pot;
      const callPart = toCall;
      const maxTotal = potBeforeThis + 2*callPart;
      const minTotal = callPart + stake.bb;
      const stackCeiling = effStack - alreadyInBefore;
      const factor = forcedPot ? 1 : pickFactor('pre', volRaises);
      let totalPutIn = roundToStake(factor*maxTotal, stake);
      if(totalPutIn < minTotal) totalPutIn = minTotal;
      if(totalPutIn > stackCeiling) totalPutIn = stackCeiling;
      const potted = totalPutIn === maxTotal;
      if(potted) anyPotYet = true;
      contributions[seatIdx] += totalPutIn;
      pot += totalPutIn;
      currentBet = contributions[seatIdx];
      raisesSoFar++;
      volRaises++;
      actedSince = new Set([pos]);

      const entry = {seat:seatIdx, role:roleOf(seatIdx), text:`raises to <b>$${currentBet}</b>`, kind:'raise', amount:contributions[seatIdx], potted};
      if(potted){
        const callHeroThis = lastBetBefore - alreadyInBefore;
        entry.quiz = true;
        entry.callHero = callHeroThis;
        entry.potBeforeHero = potBeforeThis;
        entry.lastBet = lastBetBefore;
        entry.alreadyIn = alreadyInBefore;
        entry.trails = potBeforeThis - lastBetBefore - alreadyInBefore;
        entry.correctPutIn = alreadyInBefore + totalPutIn;
        entry.newMoneyThisAction = totalPutIn;
      }
      log.push(entry);
    }
  }

  return {
    buttonIdx, sbIdx, bbIdx, straddleIdx, dblStraddleIdx, willStraddle, willDblStraddle,
    log, contributions, folded, pot, roleOf, effStack
  };
}

function dealPreflop(stake, opts, fixedStack, needFlop){
  let r, eff;
  for(let attempt=0; attempt<30; attempt++){
    eff = fixedStack ? fixedStack() : undefined;
    r = simulatePreflopRound(stake, Object.assign({}, opts, eff ? {effStack:eff} : {}));
    if(r.log.some(e=>e.quiz) && (!needFlop || r.folded.size <= 6)) break;
  }
  return r;
}

function generateScenario(stake, opts){
  const r = dealPreflop(stake, opts);
  return {
    stake, buttonIdx:r.buttonIdx, sbIdx:r.sbIdx, bbIdx:r.bbIdx, straddleIdx:r.straddleIdx, dblStraddleIdx:r.dblStraddleIdx,
    willStraddle:r.willStraddle, willDblStraddle:r.willDblStraddle,
    log:r.log, contributions:r.contributions, folded:r.folded, roleOf:r.roleOf, effStack:r.effStack
  };
}

// One betting street. priorStreetsUsed = chips each seat already put in on earlier streets.
// Nobody can put in more than the shortest live stack can match.
function simulateStreet(stake, order, startingPot, roleOf, forceGuarantee, priorStreetsUsed, effStack, phase){
  if(forceGuarantee === undefined) forceGuarantee = true;
  if(!priorStreetsUsed) priorStreetsUsed = new Array(8).fill(0);
  if(!effStack) effStack = drawEffStack(stake);
  if(!phase) phase = 'flop';
  const contributions = new Array(8).fill(0);
  let pot = startingPot;
  let currentBet = 0;
  const folded = new Set();
  const log = [];

  const streetCap = Math.max(0, Math.min(...order.map(s => effStack - priorStreetsUsed[s])));

  let raisesSoFar = 0;
  let volRaises = 0;
  let anyPotYet = false;
  let liveCount = order.length;
  const livePositions = new Set(order.map((_,i)=>i));
  let actedSince = new Set();
  let posPointer = 0;
  let guard = 0;
  const N = order.length;

  while(liveCount > 1 && guard < 60){
    guard++;
    const pos = posPointer % N;
    posPointer++;
    if(!livePositions.has(pos)) continue;
    if(actedSince.has(pos)) break;

    const seatIdx = order[pos];
    const toCall = currentBet - contributions[seatIdx];
    const remaining = streetCap - contributions[seatIdx];
    const canRaise = raisesSoFar < 3 && (remaining - toCall) >= stake.bb;
    const wouldClose = (actedSince.size + 1) >= liveCount;
    let action = chooseAction(phase, toCall, volRaises, canRaise);
    let forcedPot = false;

    if(forceGuarantee && !anyPotYet){
      const handWouldEnd = (action==='fold' && (liveCount-1 <= 1));
      const roundWouldCloseWithNoBet = (action!=='raise' && wouldClose);
      if((handWouldEnd || roundWouldCloseWithNoBet) && (pot + 2*toCall) <= remaining){
        action = 'raise';
        forcedPot = true;
      }
    }

    if(action==='fold'){
      folded.add(seatIdx);
      livePositions.delete(pos); liveCount--;
      actedSince.add(pos);
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:'folds', kind:'fold', amount:null});
    } else if(action==='check'){
      actedSince.add(pos);
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:'checks', kind:'check', amount:null});
    } else if(action==='call'){
      actedSince.add(pos);
      contributions[seatIdx] += toCall;
      pot += toCall;
      log.push({seat:seatIdx, role:roleOf(seatIdx), text:`calls <b>$${toCall}</b>`, kind:'call', amount:contributions[seatIdx]});
    } else {
      const alreadyInBefore = contributions[seatIdx];
      const lastBetBefore = currentBet;
      const potBeforeThis = pot;
      const callPart = toCall;
      const maxTotal = potBeforeThis + 2*callPart;
      const minTotal = callPart + stake.bb;
      const stackCeiling = streetCap - alreadyInBefore;
      const factor = forcedPot ? 1 : pickFactor(phase, volRaises);
      let totalPutIn = roundToStake(factor*maxTotal, stake);
      if(totalPutIn < minTotal) totalPutIn = minTotal;
      if(totalPutIn > stackCeiling) totalPutIn = stackCeiling;
      const potted = totalPutIn === maxTotal;
      if(potted) anyPotYet = true;
      contributions[seatIdx] += totalPutIn;
      pot += totalPutIn;
      currentBet = contributions[seatIdx];
      raisesSoFar++;
      volRaises++;
      actedSince = new Set([pos]);
      const verb = alreadyInBefore===0 && lastBetBefore===0 ? 'bets' : 'raises to';

      const entry = {seat:seatIdx, role:roleOf(seatIdx), text:`${verb} <b>$${currentBet}</b>`, kind:'raise', amount:contributions[seatIdx], potted};
      if(potted){
        const callHeroThis = lastBetBefore - alreadyInBefore;
        entry.quiz = true;
        entry.callHero = callHeroThis;
        entry.potBeforeHero = potBeforeThis;
        entry.lastBet = lastBetBefore;
        entry.alreadyIn = alreadyInBefore;
        entry.trails = potBeforeThis - lastBetBefore - alreadyInBefore;
        entry.correctPutIn = alreadyInBefore + totalPutIn;
        entry.newMoneyThisAction = totalPutIn;
      }
      log.push(entry);
    }
  }

  return { log, contributions, folded, pot };
}

function generateFlopScenario(stake){
  let sc;
  for(let attempt=0; attempt<40; attempt++){
    sc = buildFlopScenario(stake);
    if(sc.log.some(e=>e.quiz)) break;
  }
  return sc;
}

function buildFlopScenario(stake){
  const buttonIdx = rnd(8);
  const numSawFlop = 2 + rnd(4); // 2..5 players saw the flop
  const liveSet = new Set();
  while(liveSet.size < numSawFlop) liveSet.add(rnd(8));
  const preflopFolded = new Set();
  for(let i=0;i<8;i++) if(!liveSet.has(i)) preflopFolded.add(i);

  // action order: position order starting left of the button, restricted to live seats
  const order = [];
  for(let k=1;k<=8;k++){
    const seat = mod8(buttonIdx+k);
    if(liveSet.has(seat)) order.push(seat);
  }

  // What each player put in preflop: a limp, a pot raise, a 3-bet pot, or (rarely) a 4-bet pot
  const rr = Math.random();
  const perPlayer = roundToStake(stake.bb * (rr < 0.15 ? 1 : rr < 0.70 ? 3 + rnd(3) : rr < 0.95 ? 10 + rnd(8) : 30 + rnd(20)), stake);
  const dead = roundToStake(stake.bb * (1 + rnd(3)), stake);
  const carryoverPot = perPlayer*numSawFlop + dead;
  const priorUsed = new Array(8).fill(0);
  order.forEach(s=>{ priorUsed[s] = perPlayer; });
  // deep enough that a pot-sized bet on the flop is possible
  const effStack = Math.max(drawEffStack(stake), roundToStake(perPlayer + carryoverPot + 4*stake.bb, stake));
  const roleOf = (idx)=> idx===buttonIdx ? 'BTN' : '';
  const lead = [{info:true, text:`&rarr; The pot carries <b>$${carryoverPot}</b> to the flop. ${numSawFlop} players are still in the hand.`}];
  const res = simulateStreet(stake, order, carryoverPot, roleOf, true, priorUsed, effStack, 'flop');

  return {
    stake, buttonIdx, street:'flop', carryoverPot, preflopFolded, effStack, priorUsed,
    log: lead.concat(res.log), contributions: res.contributions, folded: res.folded, roleOf
  };
}

function generateWholeHandScenario(stake, opts){
  const pre = dealPreflop(stake, opts, ()=>drawEffStack(stake), true);
  const effStack = pre.effStack;
  let combinedLog = pre.log.slice();
  const cumulativeFolded = new Set(pre.folded);
  let liveSeats = [];
  for(let i=0;i<8;i++) if(!cumulativeFolded.has(i)) liveSeats.push(i);
  let pot = pre.pot;
  const stackUsed = pre.contributions.slice();

  const streetNames = ['FLOP','TURN','RIVER'];
  for(const name of streetNames){
    if(liveSeats.length <= 1) break;
    const order = [];
    for(let k=1;k<=8;k++){
      const seat = mod8(pre.buttonIdx+k);
      if(liveSeats.includes(seat)) order.push(seat);
    }
    combinedLog.push({info:true, street:true, streetName:name, potTotal:pot, text:name});
    const wantPot = Math.random() < ({FLOP:0.92, TURN:0.85, RIVER:0.75}[name]);
    const res = simulateStreet(stake, order, pot, pre.roleOf, wantPot, stackUsed, effStack, name.toLowerCase());
    combinedLog = combinedLog.concat(res.log);
    res.folded.forEach(s=>cumulativeFolded.add(s));
    liveSeats = liveSeats.filter(s=>!res.folded.has(s));
    pot = res.pot;
    for(let i=0;i<8;i++) stackUsed[i] += res.contributions[i];
  }

  return {
    stake, buttonIdx:pre.buttonIdx, sbIdx:pre.sbIdx, bbIdx:pre.bbIdx, straddleIdx:pre.straddleIdx, dblStraddleIdx:pre.dblStraddleIdx,
    willStraddle:pre.willStraddle, willDblStraddle:pre.willDblStraddle,
    log: combinedLog, folded: cumulativeFolded, roleOf: pre.roleOf, effStack
  };
}

function seatPos(i, rx, ry){
  const angle = (-90 + i*45) * Math.PI/180;
  return { x: 50 + rx*Math.cos(angle), y: 50 + ry*Math.sin(angle) };
}

function chipColorFor(stake){
  const map = {'2-2':'#f4f0e6','5-5':'#ff4d6d','10-10':'#2f8fff','25-25':'#2be283'};
  return map[stake.key] || '#ffcc33';
}

let seatDivBySeat = {};
let chipDivBySeat = {};
let dealTimer = null;
let currentSkip = null;
let currentQuiz = null;
let pendingResumeSeatDiv = null;
let pendingResumeIdx = null;

function renderSeatsBase(sc){
  actingDiv = null;
  const layer = document.getElementById('seatLayer');
  layer.innerHTML = '';
  seatDivBySeat = {};
  for(let i=0;i<8;i++){
    const {x,y} = seatPos(i, 43, 38);
    const div = document.createElement('div');
    div.className = 'seat';
    div.style.left = x+'%';
    div.style.top = y+'%';
    const role = sc.roleOf(i);
    div.setAttribute('aria-label', `Seat ${i+1}`);
    if(role && String(role).includes('BTN')) div.classList.add('is-btn');
    div.innerHTML = `<div class="avatar-ring">${i+1}</div><div class="label">${role?`<span class="tag">${role}</span>`:''}<span class="tag status"></span></div>`;
    layer.appendChild(div);
    seatDivBySeat[i] = div;
    if(sc.preflopFolded && sc.preflopFolded.has(i)){
      div.classList.add('folded');
      div.querySelector('.status').textContent = 'folded pre-flop';
    }
  }
}

function showCenterPot(amount, label){
  const el = document.getElementById('centerPot');
  el.style.display = 'flex';
  const color = document.documentElement.style.getPropertyValue('--brass') || '#ffcc33';
  el.innerHTML = `<div class="coins"><div class="c" style="bottom:0px;"></div><div class="c" style="bottom:7px;"></div><div class="c" style="bottom:14px;"></div></div><div class="amt">$${amount}</div><div class="caption">${label || 'Flop'}</div>`;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function hideCenterPot(){
  document.getElementById('centerPot').style.display = 'none';
  document.getElementById('centerPot').innerHTML = '';
}

function makeChipStack(sc, withAmount, amount){
  const color = chipColorFor(sc.stake);
  const div = document.createElement('div');
  div.className = 'chipstack';
  const coinCount = Math.min(4, 1 + Math.floor(Math.random()*3));
  let coinsHtml = '';
  for(let c=0;c<coinCount;c++){
    coinsHtml += `<div class="c" style="bottom:${c*6}px;background:${color};"></div>`;
  }
  div.innerHTML = `<div class="coins">${coinsHtml}</div>` + (withAmount ? `<div class="amt">$${amount}</div>` : '');
  return div;
}

function upsertChip(sc, seatIdx, amount, potted){
  if(chipDivBySeat[seatIdx]){
    const div = chipDivBySeat[seatIdx];
    let amt = div.querySelector('.amt');
    if(!amt){
      amt = document.createElement('div');
      amt.className = 'amt';
      div.insertBefore(amt, div.querySelector('.pot-tag'));
    }
    amt.textContent = `$${amount}`;
    if(!REDUCED){
      amt.classList.remove('bump');
      void amt.offsetWidth;
      amt.classList.add('bump');
    }
    setPotTag(div, potted);
    Sound.chip();
    return;
  }
  const div = makeChipStack(sc, true, amount);
  slideChipIn(div, seatIdx);
  chipDivBySeat[seatIdx] = div;
  setPotTag(div, potted);
  Sound.chip();
}

function setPotTag(div, potted){
  let tag = div.querySelector('.pot-tag');
  if(potted && !tag){
    tag = document.createElement('div');
    tag.className = 'pot-tag';
    tag.textContent = 'POT';
    div.appendChild(tag);
  }
}

function revealQuizChip(sc, q){
  const seatIdx = q.seat;
  let div = chipDivBySeat[seatIdx];
  if(!div){
    div = makeChipStack(sc, false);
    slideChipIn(div, seatIdx);
    chipDivBySeat[seatIdx] = div;
    Sound.chip();
  }
  const existingAmt = div.querySelector('.amt');
  if(existingAmt) existingAmt.remove();
  const existingTag = div.querySelector('.pot-tag');
  if(existingTag) existingTag.remove();
  setTimeout(()=>{
    if(div.querySelector('.amt')) return;
    const amt = document.createElement('div');
    amt.className = 'amt';
    amt.textContent = `$${q.correctPutIn}`;
    div.appendChild(amt);
    if(!REDUCED) amt.classList.add('bump');
  }, 600);
}

function applyEntryVisual(sc, entry){
  if(entry.info) return;
  const seatDiv = seatDivBySeat[entry.seat];
  setActing(seatDiv);
  const stEl = seatDiv.querySelector('.status');
  if(entry.kind === 'check'){
    stEl.textContent = 'check';
    Sound.knock();
  } else if(entry.kind !== 'fold' && !stEl.classList.contains('pot-status')){
    stEl.textContent = '';
  }
  if(entry.kind === 'fold'){
    seatDiv.classList.add('folded');
    seatDiv.querySelector('.status').textContent = 'folded';
  }
  if(entry.amount != null){
    upsertChip(sc, entry.seat, entry.amount, !!entry.potted);
  }
}

function applyStreetTransition(sc, entry){
  const layer = document.getElementById('chipLayer');
  const old = [...layer.children];
  chipDivBySeat = {};
  setActing(null);
  Object.values(seatDivBySeat).forEach(d=>{
    if(!d.classList.contains('folded')){
      const st = d.querySelector('.status');
      if(st && !st.classList.contains('pot-status')) st.textContent = '';
    }
  });
  if(REDUCED || !old.length){
    layer.innerHTML = '';
  } else {
    old.forEach(d=>{
      d.classList.remove('moving');
      d.classList.add('sweep');
      d.style.left = '50%';
      d.style.top = '50%';
      d.style.opacity = '0';
    });
    setTimeout(()=>{ old.forEach(d=>d.remove()); }, 500);
    Sound.sweep();
  }
  showCenterPot(entry.potTotal, entry.streetName.charAt(0)+entry.streetName.slice(1).toLowerCase());
  document.getElementById('questionText').innerHTML = `<b style="font-size:20px;">${entry.streetName.charAt(0)+entry.streetName.slice(1).toLowerCase()}</b>`;
}

function animateDeal(sc, startIdx){
  let idx = startIdx || 0;
  function doStep(){
    if(idx >= sc.log.length){ handComplete(sc); return; }
    const entry = sc.log[idx];
    if(entry.quiz){
      presentQuiz(sc, entry, idx);
      return;
    }
    if(entry.street){
      applyStreetTransition(sc, entry);
      idx++;
      dealTimer = setTimeout(()=>{
        document.getElementById('questionText').innerHTML = `Dealing the hand&hellip; <button id="skipBtn" class="btn secondary" style="padding:5px 12px;font-size:12px;margin-left:6px;">Skip ahead</button>`;
        doStep();
      }, 1100);
      return;
    }
    applyEntryVisual(sc, entry);
    idx++;
    dealTimer = setTimeout(doStep, 520 + Math.floor(Math.random()*260));
  }
  currentSkip = ()=>{
    clearTimeout(dealTimer);
    while(idx < sc.log.length){
      const entry = sc.log[idx];
      if(entry.quiz){
        presentQuiz(sc, entry, idx);
        return;
      }
      if(entry.street){
        applyStreetTransition(sc, entry);
        idx++;
        continue;
      }
      applyEntryVisual(sc, entry);
      idx++;
    }
    handComplete(sc);
  };
  dealTimer = setTimeout(doStep, 450);
}

function presentQuiz(sc, entry, idx){
  currentSkip = null;
  setActing(null);
  currentQuiz = entry;
  currentQuiz._resumeIdx = idx + 1;
  answered = false;
  const seatDiv = seatDivBySeat[entry.seat];
  seatDiv.classList.add('hero');
  const statusEl = seatDiv.querySelector('.status');
  statusEl.textContent = 'POT';
  statusEl.classList.add('pot-status');
  document.getElementById('questionText').innerHTML = `<b>What's the pot size bet?</b>`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('ticket').classList.remove('show');
  document.getElementById('proceedBtn').style.display = 'none';
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('answerInput').focus();
}

function handComplete(sc){
  setActing(null);
  currentSkip = null;
  currentQuiz = null;
  const streetsSeen = sc.log.filter(e=>e.street).map(e=>e.streetName);
  const lastStreet = streetsSeen[streetsSeen.length-1];
  const endNote = (lastStreet && lastStreet !== 'RIVER')
    ? ` Everyone else folded on the ${lastStreet.toLowerCase()}.`
    : '';
  document.getElementById('questionText').innerHTML = `<b>Hand complete.</b>${endNote}`;
  document.getElementById('answerInput').disabled = true;
  document.getElementById('submitBtn').disabled = true;
}

document.getElementById('questionText').addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'skipBtn' && currentSkip) currentSkip();
});

function dealHand(){
  if(dealTimer) clearTimeout(dealTimer);
  currentSkip = null;
  currentQuiz = null;
  pendingResumeSeatDiv = null;
  pendingResumeIdx = null;
  document.getElementById('proceedBtn').style.display = 'none';
  if(currentStreet === 'flop'){
    scenario = generateFlopScenario(currentStake);
  } else if(currentStreet === 'whole'){
    const straddleOn = document.getElementById('straddleToggle').checked;
    const dblStraddleOn = document.getElementById('doubleStraddleToggle').checked;
    scenario = generateWholeHandScenario(currentStake, {straddle:straddleOn, doubleStraddle:dblStraddleOn});
  } else {
    const straddleOn = document.getElementById('straddleToggle').checked;
    const dblStraddleOn = document.getElementById('doubleStraddleToggle').checked;
    scenario = generateScenario(currentStake, {straddle:straddleOn, doubleStraddle:dblStraddleOn});
  }
  answered = false;
  chipDivBySeat = {};
  document.getElementById('chipLayer').innerHTML = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('ticket').classList.remove('show');
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = true;
  document.getElementById('submitBtn').disabled = true;
  renderSeatsBase(scenario);
  if(scenario.carryoverPot){
    showCenterPot(scenario.carryoverPot);
  } else {
    hideCenterPot();
  }
  let leadCount = 0;
  for(const entry of scenario.log){
    if(entry.kind !== 'blind' && !entry.info) break;
    applyEntryVisual(scenario, entry);
    leadCount++;
  }
  document.getElementById('questionText').innerHTML = `Dealing the hand&hellip; <button id="skipBtn" class="btn secondary" style="padding:5px 12px;font-size:12px;margin-left:6px;">Skip ahead</button>`;
  animateDeal(scenario, leadCount);
}

function submitAnswer(){
  if(answered || !currentQuiz) return;
  const val = parseInt(document.getElementById('answerInput').value, 10);
  if(isNaN(val)) return;
  const q = currentQuiz;
  answered = true;
  attempts++;
  const fb = document.getElementById('feedback');
  if(val === q.correctPutIn){
    correct++; streak++;
    fb.textContent = `Correct. The count is $${q.correctPutIn}.`;
    fb.className = 'feedback good';
    Sound.good();
  } else {
    streak = 0;
    fb.textContent = `Not quite. The count is $${q.correctPutIn}. Here is the math.`;
    fb.className = 'feedback bad';
    Sound.bad();
  }
  revealQuizChip(scenario, q);
  if(q.callHero === 0){
    document.getElementById('tLastBet').parentElement.style.display = 'none';
    document.getElementById('tTrails').parentElement.style.display = 'none';
    document.getElementById('tAlreadyInRow').style.display = 'none';
    if(q.alreadyIn > 0){
      document.getElementById('tFormula1').textContent = `No one has bet more than you already have in. The count is the pot plus what is already yours:`;
      document.getElementById('tFormula2').textContent = `$${q.potBeforeHero} + $${q.alreadyIn} = $${q.correctPutIn}`;
    } else {
      document.getElementById('tFormula1').textContent = `No call needed. The count is simply the pot.`;
      document.getElementById('tFormula2').textContent = '';
    }
  } else {
    document.getElementById('tLastBet').parentElement.style.display = 'flex';
    document.getElementById('tTrails').parentElement.style.display = 'flex';
    document.getElementById('tAlreadyInRow').style.display = 'none';
    document.getElementById('tLastBet').textContent = `$${q.lastBet}`;
    document.getElementById('tTrails').textContent = `$${q.trails}`;
    document.getElementById('tFormula1').textContent = `3 × $${q.lastBet} + $${q.trails} = $${q.correctPutIn}`;
    document.getElementById('tFormula2').textContent = '';
  }
  document.getElementById('tTotal').textContent = `$${q.correctPutIn}`;
  document.getElementById('tNewLevel').textContent = `$${q.newMoneyThisAction}`;
  document.getElementById('ticket').classList.add('show');
  document.getElementById('answerInput').disabled = true;
  document.getElementById('submitBtn').disabled = true;
  updateScoreboard();

  pendingResumeSeatDiv = seatDivBySeat[q.seat];
  pendingResumeIdx = q._resumeIdx;
  document.getElementById('proceedBtn').style.display = 'inline-block';
}

function proceedToNextAction(){
  if(!pendingResumeSeatDiv) return;
  const seatDiv = pendingResumeSeatDiv;
  const resumeIdx = pendingResumeIdx;
  pendingResumeSeatDiv = null;
  pendingResumeIdx = null;
  document.getElementById('proceedBtn').style.display = 'none';
  seatDiv.classList.remove('hero');
  const statusEl = seatDiv.querySelector('.status');
  statusEl.classList.remove('pot-status');
  statusEl.textContent = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('ticket').classList.remove('show');
  document.getElementById('answerInput').value = '';
  currentQuiz = null;
  const hasMoreToDeal = resumeIdx < scenario.log.length;
  if(hasMoreToDeal){
    document.getElementById('questionText').innerHTML = `Dealing the hand&hellip; <button id="skipBtn" class="btn secondary" style="padding:5px 12px;font-size:12px;margin-left:6px;">Skip ahead</button>`;
    animateDeal(scenario, resumeIdx);
  } else {
    handComplete(scenario);
  }
}

function updateScoreboard(){
  document.getElementById('streakVal').textContent = `Streak ${streak}`;
  document.getElementById('tallyVal').textContent = `${correct} / ${attempts} correct`;
}

document.getElementById('submitBtn').addEventListener('click', submitAnswer);
document.getElementById('answerInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') submitAnswer();
});
document.getElementById('nextBtn').addEventListener('click', dealHand);
document.getElementById('proceedBtn').addEventListener('click', proceedToNextAction);

document.getElementById('straddleToggle').addEventListener('change', (e)=>{
  const dbl = document.getElementById('doubleStraddleToggle');
  dbl.disabled = !e.target.checked;
  if(!e.target.checked) dbl.checked = false;
  dealHand();
});
document.getElementById('doubleStraddleToggle').addEventListener('change', dealHand);

document.querySelectorAll('.street-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentStreet = btn.dataset.street;
    document.querySelectorAll('.street-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    const straddleToggle = document.getElementById('straddleToggle');
    const dblStraddleToggle = document.getElementById('doubleStraddleToggle');
    if(currentStreet === 'flop'){
      straddleToggle.disabled = true;
      dblStraddleToggle.disabled = true;
    } else {
      straddleToggle.disabled = false;
      dblStraddleToggle.disabled = !straddleToggle.checked;
    }
    dealHand();
  });
});

dealHand();
</script>
</body>
</html>
